<!doctype html>
<html><head><meta charset="utf-8"><title>IncidentIQ Study</title>
<style>
body{font-family:system-ui;max-width:1000px;margin:32px auto;padding:0 20px}
pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:8px}
button{padding:10px 16px;margin-top:10px}
label{display:block;margin:10px 0}
textarea{width:100%;min-height:100px}
.meta{color:#666}
</style></head>
<body>
<h1>Incident Investigation Study</h1>
<p class="meta">Participant interface. Do not enter names, passwords, or other sensitive information.</p>
<div id="case"></div>
<textarea id="answer" placeholder="State your diagnosis and reasoning"></textarea>
<label>Confidence (0-100): <input id="confidence" type="number" min="0" max="100" value="50"></label>
<textarea id="action" placeholder="What diagnostic action would you take next?"></textarea>
<label>Workload (1-7): <input id="workload" type="number" min="1" max="7" value="4"></label>
<button onclick="submitTrial()">Submit decision</button>
<pre id="status"></pre>
<script>
let manifest=null,index=0,started=Date.now(),participant=null;
async function init(){
  manifest=await (await fetch('/api/trials')).json();
  participant=manifest.participant_id;
  render();
}
function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
function render(){
  const t=manifest.trials[index];
  started=Date.now();
  let html='<h2>Incident '+(index+1)+' / '+manifest.trial_count+'</h2>';
  if(t.assistance){html+='<h3>AI assistance</h3><pre>'+escapeHtml(JSON.stringify(t.assistance,null,2))+'</pre>';}
  html+='<p>'+escapeHtml(t.instructions)+'</p>';
  html+='<h3>Available telemetry</h3><pre>'+escapeHtml(JSON.stringify(t.evidence,null,2))+'</pre>';
  document.getElementById('case').innerHTML=html;
}
async function submitTrial(){
  const t=manifest.trials[index],elapsed=(Date.now()-started)/1000;
  const payload={
    trial_id:t.trial_id,participant_id:participant,public_case_id:t.public_case_id,
    start_time:new Date(started).toISOString(),end_time:new Date().toISOString(),elapsed_seconds:elapsed,
    final_diagnosis:document.getElementById('answer').value,confidence:Number(document.getElementById('confidence').value),
    diagnostic_actions:[{action_id:'participant-next-action',action_type:'diagnostic_check',target:null,rationale:document.getElementById('action').value,timestamp_s:elapsed}],
    decision_events:[{timestamp_s:elapsed,event_type:'final_decision',hypothesis:document.getElementById('answer').value,action_id:'participant-next-action',confidence:Number(document.getElementById('confidence').value)}],
    workload_score:Number(document.getElementById('workload').value),actions_followed:null,actions_overridden:null
  };
  if(t.assistance){
    const influence=prompt('If AI assistance was shown, did it influence your final decision? Enter F for followed, O for overridden, or leave blank.');
    payload.actions_followed=influence?.trim().toUpperCase()==='F';
    payload.actions_overridden=influence?.trim().toUpperCase()==='O';
  }
  await fetch('/api/trial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  index++;document.getElementById('answer').value='';document.getElementById('action').value='';
  if(index<manifest.trial_count) render();else document.getElementById('status').textContent='Study session complete.';
}
init();
</script>
</body></html>
