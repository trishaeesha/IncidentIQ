<!doctype html><html><head><meta charset="utf-8"><title>IncidentIQ Study</title>
<style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}button{padding:10px 16px;margin:6px}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:8px}.meta{color:#666}</style></head>
<body><h1>Incident Investigation Study</h1><p class="meta">Participant-facing prototype. Do not enter names, passwords, or other sensitive data.</p>
<div id="case"></div><textarea id="answer" rows="6" style="width:100%" placeholder="Your diagnosis and reasoning"></textarea><br>
<label>Confidence <input id="confidence" type="number" min="0" max="100" value="50"></label><br>
<button onclick="submitTrial()">Submit decision</button><pre id="status"></pre>
<script>
let trials=[],i=0,start=Date.now(),participant=crypto.randomUUID();
async function init(){trials=await (await fetch('/api/trials')).json();render()}
function render(){const t=trials[i];document.getElementById('case').innerHTML='<h2>Incident '+(i+1)+' / '+trials.length+'</h2><pre>'+escapeHtml(JSON.stringify(t,null,2))+'</pre>';start=Date.now()}
function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
async function submitTrial(){const t=trials[i];const payload={participant_id:participant,case_id:t.case_id,mode:t.mode,start_time:new Date(start).toISOString(),end_time:new Date().toISOString(),final_diagnosis:document.getElementById('answer').value,confidence:Number(document.getElementById('confidence').value),decision_events:[{timestamp_s:(Date.now()-start)/1000,event_type:'final_decision',hypothesis:document.getElementById('answer').value,confidence:Number(document.getElementById('confidence').value)}]};await fetch('/api/trial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});i++;document.getElementById('answer').value='';if(i<trials.length)render();else document.getElementById('status').textContent='Study session complete.'}
init();
</script></body></html>
