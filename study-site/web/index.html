<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IncidentIQ Study</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#070a0f;color:#edf2f7}
body{margin:0;background:radial-gradient(circle at 20% 0,#142333,#070a0f 55%);min-height:100vh}
.top{padding:18px 6%;border-bottom:1px solid #26303d;display:flex;justify-content:space-between}
.top b{letter-spacing:2px}.top b span{color:#75e1bf}.top a{color:#9aa7b8}
.card{max-width:850px;margin:30px auto;padding:28px;background:#0d131b;border:1px solid #273241;border-radius:18px;width:92%;box-sizing:border-box}
.muted{color:#8290a3;font-size:13px}.notice,.evidence,.assist{background:#090e15;border:1px solid #293543;padding:15px;border-radius:12px;margin:16px 0}
.assist{border-color:#386557}.options{display:grid;gap:10px}.option{padding:14px;border:1px solid #2b3746;border-radius:11px;background:#0a1017;display:flex;gap:10px}
.option.selected{border-color:#75e1bf;background:#10231e}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.scale label{text-align:center}
.scale span{display:block;padding:11px 3px;border:1px solid #2b3746;border-radius:10px}.scale label.selected span{border-color:#75e1bf;background:#10231e}
.scale small{display:block;color:#8290a3;font-size:9px;margin-top:4px}
button{background:#75e1bf;color:#06110d;border:0;padding:13px 19px;border-radius:10px;font-weight:800;margin-top:20px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.progress{color:#75e1bf;font-size:11px;letter-spacing:2px;font-weight:800}
.id{padding:14px;background:#10231e;border:1px solid #386557;border-radius:10px;display:inline-block}
h1{font-size:clamp(28px,6vw,46px)}h3{margin-top:28px}
#errorBox{display:none}.error{border-color:#7b3f45;background:#1b0d11;color:#ffd9de}
@media(max-width:600px){.scale small{display:none}}
</style></head>
<body>
<div class="top"><b>INCIDENT<span>IQ</span></b><a href="coordinator.html">Coordinator</a></div>
<main id="app"><section class="card"><div class="progress">CONTROLLED RESEARCH STUDY</div><h1>Incident investigation</h1><p>Loading the study…</p><div id="errorBox" class="notice error"></div></section></main>
<script>
window.addEventListener("error",function(e){
 var box=document.getElementById("errorBox");
 if(box){box.style.display="block";box.innerHTML="<b>Study page runtime error</b><p>"+String(e.message||"Unknown JavaScript error").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+"</p><p>Please refresh once. If it repeats, send this message to the coordinator.</p>";}
});
window.addEventListener("unhandledrejection",function(e){
 var box=document.getElementById("errorBox");
 if(box){box.style.display="block";box.innerHTML="<b>Study page runtime error</b><p>"+String(e.reason&&e.reason.message?e.reason.message:e.reason||"Unknown promise error").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+"</p>";}
});
</script>
<script src="config.js"></script>
<script>
var API=(window.INCIDENTIQ_CONFIG&&window.INCIDENTIQ_CONFIG.API_BASE)||"";
var A=document.getElementById("app");
var s={trialStartedAt:Date.now(),answers:{}};
var submitting=false;
var params=new URLSearchParams(window.location.search);
var TEST=params.get("mode")==="test";

function esc(x){
 x=x===null||x===undefined?"":String(x);
 return x.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});
}
var CASES=[
{id:"CASE-01",condition:"clear",title:"Checkout latency and CPU saturation",incident:"Checkout requests are failing or becoming slow during the incident window.",evidence:["checkoutservice CPU rises sharply after the injection.","checkoutservice latency-90 also increases.","The strongest abnormality is localized to checkoutservice CPU."],options:["Checkoutservice CPU/resource saturation","Emailservice latency issue"]},
{id:"CASE-02",condition:"ambiguous",title:"Checkout memory pressure with error-like logs",incident:"Checkout performance degrades, but the evidence does not cleanly isolate one explanation.",evidence:["checkoutservice memory changes after injection.","Error-like log activity is also present.","Both signals are plausible, so further verification is warranted."],options:["Checkoutservice memory/resource pressure","Frontend error increase"]},
{id:"CASE-03",condition:"conflicting",title:"Checkout packet-loss incident",incident:"Checkout latency rises while log-rate evidence points in a competing direction.",evidence:["checkoutservice latency-90 increases after injection.","checkoutservice log-rate evidence changes as well.","The two evidence sources do not independently justify the same conclusion."],options:["Checkoutservice network packet loss","Emailservice latency issue"]},
{id:"CASE-04",condition:"misleading",title:"Distracting emailservice latency",incident:"A visible latency change appears in emailservice, but it is not the injected root cause.",evidence:["emailservice latency-90 changes after injection.","The visible emailservice signal is a distractor.","The actual fault is associated with checkoutservice network loss."],options:["Emailservice latency is the root cause","Checkoutservice network packet loss"]},
{id:"CASE-05",condition:"incomplete",title:"User-service packet loss with missing telemetry",incident:"The user service is affected, but one telemetry source is unavailable.",evidence:["user-service incident evidence indicates network loss.","Metrics and logs are available.","Trace telemetry is unavailable, so the evidence is incomplete."],options:["User-service network packet loss","User-service memory stress"]}
];

function page(x){A.innerHTML='<section class="card">'+x+"</section>";checkReady();}

function call(action,b,timeoutMs){
 b=b||{};timeoutMs=timeoutMs||30000;
 if(!API||API.indexOf("PASTE_")>=0)throw new Error("Backend URL is not configured.");
 var ctl=new AbortController();
 var tm=setTimeout(function(){ctl.abort();},timeoutMs);
 return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action},b)),signal:ctl.signal})
 .then(function(r){return r.json();})
 .then(function(j){if(!j.ok)throw new Error(j.error||"Request failed");return j;})
 .catch(function(e){if(e.name==="AbortError")throw new Error("The study server took too long to respond. Please try again.");throw e;})
 .then(function(j){clearTimeout(tm);return j;},function(e){clearTimeout(tm);throw e;});
}

function localTrial(c,i,arm){
 var x={trialIndex:i+1,caseId:c.id,condition:c.condition,title:c.title,incident:c.incident,evidence:c.evidence,options:c.options};
 if(arm==="generic_ai")x.assistance={text:"The strongest salient observation is highlighted. Treat it as one input, not guaranteed truth.",highlight:c.evidence[0]};
 if(arm==="incidentiq")x.assistance={text:"Evidence-grounded assistance: compare supporting and contradictory evidence before deciding.",supporting:c.evidence.slice(0,2),uncertainty:c.condition==="clear"?"low":"elevated"};
 return x;
}

function home(){
 page('<div class="progress">CONTROLLED RESEARCH STUDY</div><h1>Incident investigation</h1><p>Review five software incidents and choose the most defensible diagnosis from the evidence.</p><div class="notice">Do not enter your name or sensitive information. Your participant number is assigned automatically.</div><button onclick="start()">Start study</button> <a href="?mode=test" style="color:#75e1bf">Run a private test</a><p class="muted">Test mode never reserves P01–P30.</p>');
}

function start(){
 if(submitting)return;
 submitting=true;
 var j;
 try{
  if(TEST){
   var testId="TEST-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
   j={ok:true,test:true,participantId:"TEST",testId:testId,token:"TEST-ONLY",completedTrials:[],trials:CASES.map(function(c,i){return localTrial(c,i,"incidentiq");})};
   s=Object.assign({},j,{i:0,answers:{},trialStartedAt:Date.now()});
   draw();submitting=false;return;
  }
  var q=localStorage.getItem("iiq");
  var req=q?call("resume",JSON.parse(q)):call("reserve");
  req.then(function(resp){
   localStorage.setItem("iiq",JSON.stringify({participantId:resp.participantId,token:resp.token}));
   s=Object.assign({},resp,{i:0,answers:{},trialStartedAt:Date.now()});
   draw();
  }).catch(function(e){
   localStorage.removeItem("iiq");
   page("<h1>Cannot start</h1><p>"+esc(e.message)+"</p><button onclick='home()'>Back</button>");
  }).then(function(){submitting=false;});
 }catch(e){
  if(!TEST)localStorage.removeItem("iiq");
  page("<h1>Cannot start</h1><p>"+esc(e.message)+"</p><button onclick='home()'>Back</button>");
  submitting=false;
 }
}

function draw(){
 var t=s.trials[s.i],a=s.answers[t.trialIndex]||{};
 var ai="";
 if(t.assistance){
  ai="<div class=\"assist\"><b>AI assistance</b><p>"+esc(t.assistance.text)+"</p>";
  if(t.assistance.highlight)ai+="<div>"+esc(t.assistance.highlight)+"</div>";
  if(t.assistance.supporting)ai+="<ul>"+t.assistance.supporting.map(function(v){return "<li>"+esc(v)+"</li>";}).join("")+"</ul>";
  ai+="</div>";
 }
 var html="";
 html+="<div class=\"progress\">"+(TEST?"TEST MODE · ":"")+"TRIAL "+(s.i+1)+" / 5</div>";
 html+="<div class=\"muted\">Participant: "+esc(s.participantId)+"</div>";
 html+="<h1>"+esc(t.title)+"</h1><p>"+esc(t.incident)+"</p>";
 html+="<div class=\"evidence\">"+t.evidence.map(function(v){return "<div>• "+esc(v)+"</div>";}).join("")+"</div>"+ai;
 html+="<h3>Diagnosis</h3><div class=\"options\">";
 html+=t.options.map(function(o){
  return "<label class=\"option"+(a.diagnosis===o?" selected":"")+"\"><input type=\"radio\" name=\"d\" value=\""+esc(o)+"\" "+(a.diagnosis===o?"checked":"")+">"+esc(o)+"</label>";
 }).join("");
 html+="</div>";
 html+="<h3>How confident are you?</h3><div class=\"scale\">";
 html+=[1,2,3,4,5].map(function(n){
  return "<label class=\""+(a.confidence==n?"selected":"")+""><input type=\"radio\" name=\"c\" value=\""+n+"\" "+(a.confidence==n?"checked":"")+"><span>"+n+"<small>"+["Not confident","Low","Moderate","High","Very confident"][n-1]+"</small></span></label>";
 }).join("");
 html+="</div>";
 html+="<h3>How much workload did this trial require?</h3><div class=\"scale\">";
 html+=[1,2,3,4,5].map(function(n){
  return "<label class=\""+(a.workload==n?"selected":"")+""><input type=\"radio\" name=\"w\" value=\""+n+"\" "+(a.workload==n?"checked":"")+"><span>"+n+"<small>"+["Very low","Low","Moderate","High","Very high"][n-1]+"</small></span></label>";
 }).join("");
 html+="</div>";
 if(t.assistance){
  html+="<div class=\"notice\"><b>Use of assistance</b><p><label><input id=\"f\" type=\"checkbox\"> I followed the assistance</label></p><p><label><input id=\"o\" type=\"checkbox\"> I overrode the assistance</label></p></div>";
 }
 html+="<button id=\"nextBtn\" disabled onclick=\"next()\">"+(s.i===4?"Finish study":"Save & Next")+"</button>";
 page(html);
}
function checkReady(){
 var b=document.getElementById("nextBtn");if(!b)return;
 var d=document.querySelector('input[name="d"]:checked'),c=document.querySelector('input[name="c"]:checked'),w=document.querySelector('input[name="w"]:checked');
 b.disabled=!(d&&c&&w);
 var labels=document.querySelectorAll(".option,.scale label");
 for(var i=0;i<labels.length;i++){
  var input=labels[i].querySelector("input");
  if(input)labels[i].className=labels[i].className.replace(/\sselected/g,"")+(input.checked?" selected":"");
 }
}

function next(){
 if(submitting)return;
 var t=s.trials[s.i];
 var d=document.querySelector('input[name="d"]:checked');
 var c=document.querySelector('input[name="c"]:checked');
 var w=document.querySelector('input[name="w"]:checked');
 if(!d||!c||!w)return;
 s.answers[t.trialIndex]={diagnosis:d.value,confidence:Number(c.value),workload:Number(w.value),aiFollowed:!!(document.getElementById("f")&&document.getElementById("f").checked),aiOverridden:!!(document.getElementById("o")&&document.getElementById("o").checked)};
 var answer=s.answers[t.trialIndex];
 submitting=true;
 var b=document.getElementById("nextBtn");
 if(b){b.disabled=true;b.textContent=s.i===4?"Submitting…":"Saving…";}
 var done=function(){
  if(s.i===4){
   if(!TEST){
    call("finalize",{participantId:s.participantId,token:s.token}).then(function(){
     localStorage.removeItem("iiq");
     page('<div style="text-align:center"><div class="progress">SUBMISSION COMPLETE</div><h1>Thank you.</h1><p>Your five trials were recorded.</p><div class="id">Participant ID: <b>'+esc(s.participantId)+"</b></div></div>");
    }).catch(function(e){if(b){b.disabled=false;b.textContent="Finish study";}alert(e.message);}).then(function(){submitting=false;});
    return;
   }
   page('<div style="text-align:center"><div class="progress">PRIVATE TEST COMPLETE</div><h1>Test complete.</h1><p>This private test did not reserve or save any participant slot.</p><div class="id">Participant ID: <b>TEST</b></div><p><a href="?mode=test" style="color:#75e1bf">Run test again</a></p></div>');
   submitting=false;return;
  }
  s.i++;s.trialStartedAt=Date.now();draw();submitting=false;
 };
 if(TEST){setTimeout(done,120);return;}
 call("saveTrial",{participantId:s.participantId,token:s.token,trialIndex:t.trialIndex,caseId:t.caseId,diagnosis:answer.diagnosis,confidence:answer.confidence,workload:answer.workload,aiFollowed:answer.aiFollowed,aiOverridden:answer.aiOverridden,elapsedSeconds:Math.max(0,Math.round((Date.now()-s.trialStartedAt)/1000))})
 .then(done).catch(function(e){if(b){b.disabled=false;b.textContent=s.i===4?"Finish study":"Save & Next";}alert(e.message);submitting=false;});
}

document.addEventListener("change",checkReady);
home();
</script></body></html>
