<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IncidentIQ Study</title><style>:root{font-family:system-ui;background:#070a0f;color:#edf2f7}body{margin:0;background:radial-gradient(circle at 20% 0,#142333,#070a0f 55%);min-height:100vh}.top{padding:18px 6%;border-bottom:1px solid #26303d;display:flex;justify-content:space-between}.top b{letter-spacing:2px}.top b span{color:#75e1bf}.top a{color:#9aa7b8}.card{max-width:850px;margin:30px auto;padding:28px;background:#0d131b;border:1px solid #273241;border-radius:18px;width:92%;box-sizing:border-box}.muted{color:#8290a3;font-size:13px}.notice,.evidence,.assist{background:#090e15;border:1px solid #293543;padding:15px;border-radius:12px;margin:16px 0}.assist{border-color:#386557}.options{display:grid;gap:10px}.option{padding:14px;border:1px solid #2b3746;border-radius:11px;background:#0a1017;display:flex;gap:10px}.option:has(input:checked){border-color:#75e1bf;background:#10231e}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.scale label{text-align:center}.scale span{display:block;padding:11px 3px;border:1px solid #2b3746;border-radius:10px}.scale input:checked+span{border-color:#75e1bf;background:#10231e}.scale small{display:block;color:#8290a3;font-size:9px;margin-top:4px}button{background:#75e1bf;color:#06110d;border:0;padding:13px 19px;border-radius:10px;font-weight:800;margin-top:20px;cursor:pointer}.progress{color:#75e1bf;font-size:11px;letter-spacing:2px;font-weight:800}.id{padding:14px;background:#10231e;border:1px solid #386557;border-radius:10px;display:inline-block}h1{font-size:clamp(28px,6vw,46px)}h3{margin-top:28px}@media(max-width:600px){.scale small{display:none}}</style></head><body><div class="top"><b>INCIDENT<span>IQ</span></b><a href="coordinator.html">Coordinator</a></div><main id="app"></main><script src="config.js"></script><script>const API=INCIDENTIQ_CONFIG.API_BASE,A=document.getElementById('app');let s={};const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function call(action,b={}){if(!API||API.includes('PASTE_'))throw Error('Backend URL is not configured yet.');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...b})});const j=await r.json();if(!j.ok)throw Error(j.error||'Request failed');return j}function page(x){A.innerHTML='<section class="card">'+x+'</section>'}const TEST=new URLSearchParams(location.search).get('mode')==='test';function home(){page('<div class="progress">CONTROLLED RESEARCH STUDY</div><h1>Incident investigation</h1><p>Review five software incidents and choose the most defensible diagnosis from the evidence.</p><div class="notice">Do not enter your name or sensitive information. Your participant number is assigned automatically.</div><button onclick="start()">Start study</button><p class="muted">One common QR/link is used for everyone. The server assigns the next available slot.</p>')}async function start(){try{let q=localStorage.iiq;let j=TEST?await call('test'):q?await call('resume',JSON.parse(q)):await call('reserve');s=j;if(!TEST)localStorage.iiq=JSON.stringify({participantId:j.participantId,token:j.token});s.i=0;s.answers={};if(!TEST&&Array.isArray(j.completedTrials)&&j.completedTrials.length){const done=new Set(j.completedTrials.map(Number));const first=s.trials.findIndex(t=>!done.has(Number(t.trialIndex)));s.i=first<0?4:first;}draw()}catch(e){localStorage.removeItem('iiq');page('<h1>Cannot start</h1><p>'+esc(e.message)+'</p>')}}function draw(){let t=s.trials[s.i],a=s.answers[t.trialIndex]||{};let ai=t.assistance?'<div class="assist"><b>AI assistance</b><p>'+esc(t.assistance.text)+'</p>'+(t.assistance.highlight?'<div>'+esc(t.assistance.highlight)+'</div>':'')+(t.assistance.supporting?'<ul>'+t.assistance.supporting.map(esc).map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')+'</div>':'';page('<div class="progress">'+(TEST?'TEST MODE · ':'')+'TRIAL '+(s.i+1)+' / 5</div><div class="muted">Participant: '+esc(s.participantId)+'</div><h1>'+esc(t.title)+'</h1><p>'+esc(t.incident)+'</p><div class="evidence">'+t.evidence.map(esc).map(x=>'<div>• '+x+'</div>').join('')+'</div>'+ai+'<h3>Diagnosis</h3><div class="options">'+t.options.map(o=>'<label class="option"><input type="radio" name="d" value="'+esc(o)+'" '+(a.diagnosis===o?'checked':'')+'>'+esc(o)+'</label>').join('')+'</div><h3>How confident are you?</h3><div class="scale">'+[1,2,3,4,5].map(n=>'<label><input type="radio" name="c" value="'+n+'" '+(a.confidence==n?'checked':'')+'><span>'+n+'<small>'+['Not confident','Low','Moderate','High','Very confident'][n-1]+'</small></span></label>').join('')+'</div><h3>How much workload did this trial require?</h3><div class="scale">'+[1,2,3,4,5].map(n=>'<label><input type="radio" name="w" value="'+n+'" '+(a.workload==n?'checked':'')+'><span>'+n+'<small>'+['Very low','Low','Moderate','High','Very high'][n-1]+'</small></span></label>').join('')+'</div>'+(t.assistance?'<div class="notice"><b>Use of assistance</b><p><label><input id="f" type="checkbox"> I followed the assistance</label></p><p><label><input id="o" type="checkbox"> I overrode the assistance</label></p></div>':'')+'<button onclick="next()">'+(s.i===4?'Finish study':'Save & Next')+'</button>')}async function next(){let t=s.trials[s.i],d=document.querySelector('input[name=d]:checked')?.value,c=Number(document.querySelector('input[name=c]:checked')?.value),w=Number(document.querySelector('input[name=w]:checked')?.value);if(!d||!c||!w)return alert('Please select diagnosis, confidence and workload.');try{if(!TEST)await call('saveTrial',{participantId:s.participantId,token:s.token,trialIndex:t.trialIndex,caseId:t.caseId,diagnosis:d,confidence:c,workload:w,aiFollowed:!!document.getElementById('f')?.checked,aiOverridden:!!document.getElementById('o')?.checked});if(s.i===4){if(!TEST){await call('finalize',{participantId:s.participantId,token:s.token});localStorage.removeItem('iiq')}page('<div style="text-align:center"><div class="progress">SUBMISSION COMPLETE</div><h1>Thank you.</h1><p>Your five trials were recorded.</p><div class="id">Participant ID: <b>'+esc(s.participantId)+'</b></div></div>')}else{s.i++;draw()}}catch(e){alert(e.message)}}home();</script></body></html>
