<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IncidentIQ Coordinator</title><style>body{margin:0;background:#070a0f;color:#edf2f7;font-family:system-ui}.top{padding:18px 6%;border-bottom:1px solid #26303d;display:flex;justify-content:space-between}.top a{color:#9aa7b8}.card{max-width:1000px;margin:30px auto;padding:25px;background:#0d131b;border:1px solid #273241;border-radius:18px;width:92%;box-sizing:border-box}input{padding:13px;width:100%;box-sizing:border-box;background:#080c12;color:white;border:1px solid #303c4c;border-radius:9px}button{background:#75e1bf;border:0;border-radius:9px;padding:11px 16px;font-weight:800;margin:12px 5px 0 0;cursor:pointer}.stats{display:flex;gap:10px}.stats div{padding:16px;border:1px solid #293543;border-radius:10px;flex:1}.stats b{font-size:25px;display:block}table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #222c39}.muted{color:#8290a3}.progress{color:#75e1bf;font-size:11px;letter-spacing:2px}</style></head><body><div class="top"><b>INCIDENT<span style="color:#75e1bf">IQ</span> COORDINATOR</b><a href="index.html">Participant</a></div><main id="app"></main><script src="config.js"></script><script>const API=INCIDENTIQ_CONFIG.API_BASE,A=document.getElementById('app');let key='';const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function call(action,b={}){if(!API||API.includes('PASTE_'))throw Error('Backend URL is not configured yet.');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,key,...b})});const raw=await r.text();let j;try{j=JSON.parse(raw)}catch(e){const preview=String(raw||'').replace(/\\s+/g,' ').slice(0,240);throw Error('Backend returned non-JSON (HTTP '+r.status+'). '+(preview||'Empty response'))}if(!r.ok)throw Error(j.error||('HTTP '+r.status));if(!j.ok)throw Error(j.error||'Request failed');return j}function login(){A.innerHTML='<section class="card"><div class="progress">PRIVATE COORDINATOR VIEW</div><h1>Study control</h1><input id="k" type="password" placeholder="Coordinator key"><button onclick="openC()">Open</button><p class="muted">Do not share the coordinator key with participants.</p></section>'}async function openC(){key=document.getElementById('k').value;try{show((await call('status')).participants)}catch(e){alert(e.message)}}function show(p){let done=p.filter(x=>x.status==='completed').length,active=p.filter(x=>x.status==='reserved').length,available=p.filter(x=>x.status==='available').length;A.innerHTML='<section class="card"><div class="progress">LIVE COLLECTION</div><h1>Participant tracker</h1><div class="stats"><div><b>'+done+'/30</b>completed</div><div><b>'+active+'</b>in progress</div><div><b>'+(30-done)+'</b>remaining</div></div><button onclick="zip(\'ALL\')">Download ALL ZIP</button><button onclick="zip(\'TEST\')">Download TEST ZIP</button><button onclick="refresh()">Refresh</button><table><tr><th>ID</th><th>Assistance category</th><th>Status</th><th>Trials</th><th>Actions</th></tr>'+p.map(x=>'<tr><td>'+esc(x.participantId)+'</td><td>'+esc(x.arm)+'</td><td>'+esc(x.status)+'</td><td>'+x.trialCount+'/5</td><td><button onclick="zip(\''+x.participantId+'\')">ZIP</button>'+((x.status==='reserved'&&x.trialCount===0)?'<button onclick="releaseSlot(\''+x.participantId+'\')">Release</button>':'')+'</td></tr>').join('')+'</table></section>'}async function releaseSlot(id){if(!confirm('Release '+id+' so it can be reassigned?'))return;try{await call('release',{participantId:id});await refresh()}catch(e){alert(e.message)}}async function refresh(){try{show((await call('status')).participants)}catch(e){alert(e.message)}}async function zip(id){try{let j=await call('export',{participantId:id}),a=document.createElement('a');a.href='data:'+j.mimeType+';base64,'+j.base64;a.download=j.fileName;a.click()}catch(e){alert(e.message)}}login();</script></body></html>
