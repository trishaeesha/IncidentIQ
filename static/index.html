<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IncidentIQ</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#182033}header{background:#111827;color:white;padding:22px}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}textarea,input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #ccd2dc;border-radius:8px}button{padding:10px 15px;border:0;border-radius:8px;background:#2563eb;color:white;margin-right:7px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{background:#f8fafc;border-left:4px solid #94a3b8;padding:10px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>IncidentIQ</h1><div>Evidence-grounded incident investigation • Human control required</div></header><main><div class="card"><h2>Incident Evidence</h2><input id="id" value="demo-incident-001"><textarea id="ev" rows="7">CPU utilization increased
Error rate increased
Request latency increased
Database disk usage remained stable</textarea><button onclick="analyze()">Analyze Incident</button><button onclick="live()">Add Live Evidence</button><span id="s"> Ready</span></div><div class="grid"><div class="card"><h2>Decision</h2><div id="d">—</div></div><div class="card"><h2>Next Diagnostic Check</h2><div id="a">—</div></div></div><div class="card"><h2>Candidate Hypotheses</h2><div id="h">—</div></div><div class="card"><h2>Experimental NLP/NLI</h2><input id="nh" placeholder="Resource saturation"><button onclick="nli()">Run NLI</button><pre id="nr">—</pre></div></main><script>
function rows(){return document.getElementById('ev').value.split('\n').map((x,i)=>x.trim()).filter(Boolean).map((x,i)=>({evidence_id:'ui-'+(i+1),source:'user',observation:x,signal:'observation',direction:'increase',strength:'moderate',evidence_strength:'moderate',availability:'available'}))}
async function analyze(){s.textContent=' Analyzing...';let r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:id.value,evidence:rows()})}),x=await r.json();if(!r.ok){s.textContent=' '+x.error;return}s.textContent=' Complete';d.innerHTML='<b>'+x.decision.decision+'</b><br>Selected: '+(x.decision.selected_hypothesis||'None')+'<br>Human control: '+x.decision.human_control_required;a.textContent=x.decision.recommended_action||'Further verification required';h.innerHTML=(x.hypotheses.hypotheses||[]).map((z,i)=>'<div class="item"><b>'+(i+1)+'. '+z.hypothesis+'</b><br>Confidence: '+z.confidence+' | Uncertainty: '+z.uncertainty+'<br>Supporting: '+z.supporting_evidence.length+' | Contradicting: '+z.contradicting_evidence.length+' | Missing: '+z.missing_evidence.length+'<br>'+z.rationale+'</div>').join('')}
function live(){ev.value+='\nNew live observation: request latency changed';analyze()}
async function nli(){let r=await fetch('/nli',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({evidence:rows()[0]?.observation||'',hypothesis:nh.value||'Resource saturation'})});nr.textContent=JSON.stringify(await r.json(),null,2)}
</script></body></html>
