name: IncidentIQ AI Research Review

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"
      - "friend3/**"
      - "chore/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incidentiq-ai-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: Run IncidentIQ research reviewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex reviewer
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: "drop-sudo"
          prompt: |
            Read RESEARCH_CONTRACT.md first. You are the automated research/code reviewer for IncidentIQ.
            
            Review the current repository state and the changes introduced by the current push or pull request.
            
            IncidentIQ studies when evidence-grounded AI assistance improves or degrades human engineers' diagnostic decision-making during software incident troubleshooting.
            
            Do not silently redesign the research question, three experimental modes, six incident conditions, RCAEval RE2 as the primary controlled incident source, or the core evidence-grounded decision-support architecture. If a change seems necessary, flag it for the project owner.
            
            Review: change scope; code correctness; schema/interface consistency; tests; root-cause/fault leakage; train/test contamination; unsupported causal claims; gray-area labeling; Evidence Engine separation of observation from interpretation; Hypothesis/Decision uncertainty and premature diagnosis; evaluation integrity; unnecessary complexity; and unsupported novelty claims.
            
            Flag unnecessary additions such as generic LSTM/GRU/autoencoder anomaly detection, multi-agent swarms, generic chatbots, vector DB/RAG added only for novelty, autonomous RCA/remediation, cost-aware tool selection, or another standalone abstention mechanism.
            
            Never invent test results. If execution is unavailable, write exactly: "Execution not verified."
            
            Required output:
            # IncidentIQ AI Research Review
            ## 1. Project Status
            ## 2. What Changed
            ## 3. What Is Correct
            ## 4. Mistakes / Risks
            For each issue: Severity (BLOCKER/HIGH/MEDIUM/LOW), Location, Problem, Why it matters, Minimal fix.
            ## 5. Research Integrity
            ## 6. Research Impact
            ## 7. What Should NOT Be Added
            ## 8. Next Steps
            ## 9. Merge Readiness
            Choose exactly one: NOT READY / READY AFTER FIXES / READY FOR REVIEW. Do not call it ready if important tests are unverified.
            ## 10. One-Sentence Verdict
            
            Be ruthless, factual, concise, and technically specific.
          output-file: incidentiq-ai-review.md

  publish-review:
    name: Publish IncidentIQ review
    needs: codex-review
    if: always() && needs.codex-review.result == 'success' && needs.codex-review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Write review report
        env:
          REVIEW: ${{ needs.codex-review.outputs.final_message }}
        run: |
          printf '%s\n' "$REVIEW" > incidentiq-ai-review.md

      - name: Add report to workflow summary
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await core.summary
              .addHeading('IncidentIQ AI Research Review', 2)
              .addRaw(process.env.REVIEW)
              .write();

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: incidentiq-ai-review-${{ github.run_id }}
          path: incidentiq-ai-review.md
          if-no-files-found: error

      - name: Comment on associated pull request
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const review = process.env.REVIEW;
            let pullNumber = context.payload.pull_request?.number ?? null;

            if (!pullNumber && context.eventName === 'push') {
              const prs = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                  per_page: 100
                }
              );

              const openPr = prs.find(pr => pr.state === 'open');
              pullNumber = openPr?.number ?? null;
            }

            if (pullNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body:
                  '## 🤖 IncidentIQ AI Research Review\n\n' +
                  review +
                  '\n\n---\nGenerated automatically by GitHub Actions + OpenAI Codex.'
              });
            }

  publish-failure:
    name: Report reviewer failure
    needs: codex-review
    if: always() && needs.codex-review.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Add failure summary
        run: |
          {
            echo "## IncidentIQ AI Research Review"
            echo
            echo "The automated reviewer did not complete successfully."
            echo
            echo "**Execution not verified.**"
            echo
            echo "Check the failed workflow job for the underlying error."
          } >> "$GITHUB_STEP_SUMMARY"
