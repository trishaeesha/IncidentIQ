name: IncidentIQ AI Research Review

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "friend3/**"
      - "chore/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incidentiq-ai-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: Run IncidentIQ research reviewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex reviewer
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: "drop-sudo"
          prompt-file: .github/incidentiq-review-prompt.md
          output-file: incidentiq-ai-review.md

  publish-review:
    name: Publish IncidentIQ review
    needs: codex-review
    if: always() && needs.codex-review.result == 'success' && needs.codex-review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Write review report
        env:
          REVIEW: ${{ needs.codex-review.outputs.final_message }}
        run: |
          printf '%s
' "$REVIEW" > incidentiq-ai-review.md

      - name: Add report to workflow summary
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await core.summary
              .addHeading('IncidentIQ AI Research Review', 2)
              .addRaw(process.env.REVIEW)
              .write();

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: incidentiq-ai-review-${{ github.run_id }}
          path: incidentiq-ai-review.md
          if-no-files-found: error

      - name: Comment on associated pull request
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const review = process.env.REVIEW;
            let pullNumber = context.payload.pull_request?.number ?? null;

            if (!pullNumber && context.eventName === 'push') {
              const prs = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                  per_page: 100
                }
              );

              const openPr = prs.find(pr => pr.state === 'open');
              pullNumber = openPr?.number ?? null;
            }

            if (pullNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body:
                  '## 🤖 IncidentIQ AI Research Review

' +
                  review +
                  '

---
Generated automatically by GitHub Actions + OpenAI Codex.'
              });
            }

  publish-failure:
    name: Report reviewer failure
    needs: codex-review
    if: always() && needs.codex-review.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Add failure summary
        run: |
          {
            echo "## IncidentIQ AI Research Review"
            echo
            echo "The automated reviewer did not complete successfully."
            echo
            echo "**Execution not verified.**"
            echo
            echo "Check the failed workflow job for the underlying error."
          } >> "$GITHUB_STEP_SUMMARY"
