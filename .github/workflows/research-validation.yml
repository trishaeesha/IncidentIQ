name: research-validation
# Raw evidence profiling is researcher-only and never participant-facing.
on:
  push:
    branches:
      - research/step2-gray-area-harness
  pull_request:
    branches:
      - research/final-integration
jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research scripts
        run: |
          python -m py_compile experiments/acquire_rcaeval_cases.py
          python -m py_compile experiments/build_study_manifest.py
          python -m py_compile experiments/make_participant_assignment.py
          python -m py_compile experiments/make_cohort_assignments.py
          python -m py_compile experiments/audit_gray_area_candidates.py
          python -m py_compile experiments/validate_gray_area_telemetry.py
          python -m py_compile experiments/profile_gray_area_evidence.py
          python -m py_compile experiments/validate_cohort_assignments.py
          python -m py_compile experiments/score_human_study.py
          python -m py_compile experiments/study_server.py
          python -m py_compile experiments/deployment_smoke.py

  telemetry-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install telemetry dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow huggingface_hub
      - name: Download exact RCAEval gray-area cases
        run: |
          python experiments/acquire_rcaeval_cases.py --data-root data/rcaeval
      - name: Validate raw telemetry
        run: |
          python experiments/validate_gray_area_telemetry.py \
            --data-root data/rcaeval \
            --metadata data/rcaeval/cases.parquet \
            --out experiments/telemetry_validation.json
      - name: Profile extracted evidence
        run: |
          python experiments/profile_gray_area_evidence.py \
            --data-root data/rcaeval \
            --out experiments/gray_area_evidence_profile.json
      - name: Generate baseline evidence outputs
        run: |
          mkdir -p outputs
          for case in \
            re2ob_checkoutservice_cpu_2 \
            re2ob_checkoutservice_mem_2 \
            re2ob_checkoutservice_loss_1 \
            re2ob_checkoutservice_loss_2 \
            re2ss_user_loss_1
          do
            python experiments/run_real_rcaeval_case.py \
              --data-root data/rcaeval \
              --case "$case" > "outputs/$case.json"
          done
      - name: Build researcher and participant study pools
        run: |
          python experiments/build_study_manifest.py \
            --outputs outputs \
            --telemetry-validation experiments/telemetry_validation.json \
            --researcher-out experiments/researcher_trials.json \
            --researcher-pool-out experiments/researcher_pool.json \
            --participant-pool-out experiments/participant_pool.json
      - name: Counterbalance planned cohort
        run: |
          python experiments/make_cohort_assignments.py \
            --pool experiments/researcher_pool.json \
            --participants 6 \
            --out experiments/planned_cohort.json \
            --seed 20261003
      - name: Validate planned cohort
        run: |
          python experiments/validate_cohort_assignments.py \
            --input experiments/planned_cohort.json \
            --pool experiments/researcher_pool.json \
            --out experiments/cohort_validation.json
      - name: Upload researcher-only validation report
        uses: actions/upload-artifact@v4
        with:
          name: gray-area-telemetry-validation
          path: |
            experiments/telemetry_validation.json
            experiments/gray_area_evidence_profile.json
            experiments/researcher_trials.json
            experiments/researcher_pool.json
            experiments/participant_pool.json
            experiments/planned_cohort.json
            experiments/cohort_validation.json
          retention-days: 14
