name: IncidentIQ NLI Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - "research/final-integration"

jobs:
  nli-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Install optional NLI dependencies
        run: pip install -r requirements-nlp.txt
      - name: Download one public RCAEval case
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="phamquiluan/RCAEval",
              repo_type="dataset",
              allow_patterns=["re2ob_checkoutservice_cpu_2/*"],
              local_dir="rcaeval_nli",
          )
          PY
      - name: Run isolated NLI experiment
        run: |
          python experiments/run_nli_case.py             --data-root "$GITHUB_WORKSPACE/rcaeval_nli"             --case re2ob_checkoutservice_cpu_2 | tee nli_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: incidentiq-nli-result
          path: nli_result.json
